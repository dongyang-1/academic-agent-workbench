version: 0.2
default_sort: latest-first
ranking_weights:
  topical_relevance: 0.30
  recency: 0.30
  publication_quality: 0.15
  citation_signal: 0.10
  identification_quality: 0.10
  data_or_code_availability: 0.05
tie_breakers:
  - topical_relevance
  - publication_year_desc
  - citation_signal
  - publication_quality
flags:
  prefer:
    - recent papers and working papers first
    - top field journals
    - NBER, CEPR, IZA, World Bank, IMF working papers
    - papers with clear empirical design
  caution:
    - no abstract or metadata
    - inaccessible source
    - unclear publication status
